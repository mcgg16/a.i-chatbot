<!DOCTYPE html>
<html>
<head>
    <title>Chatbot</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <!-- Used to make API calls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.19.0/axios.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h1 class="text-center">Chat with A.I</h1>
                <!-- Chatbox -->
                <div id="chatbox" class="border p-3 mb-4 rounded" style="height: 400px; overflow-y: auto;">
                    <!-- Messages will be appended here -->
                </div>

                <!-- User input and send -->
                <div class="input-group">
                    <input id="inputbox" type="text" class="form-control" placeholder="Type your message...">
                    <div class="input-group-append rounded">
                        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Javascript goes here

        // Must be async to use the await
        async function sendMessage() {
            // Get elements from input 
            const inputBox = document.getElementById("inputbox"); 
            const userMessage = inputBox.value; // Gets message in input box 

            // User sent a message 
            appendMessage(userMessage, "user")

            inputBox.value = ''; // Clear input box

            // Send usser message to API
            try {
                // Call backend function
                const response = await axios.post("http://localhost:1330/message", {
                    prompt: userMessage
                })

                // Once have the message, append the aiResponse sent by the chatbot 
                appendMessage(response.data.message, "bot")

            } catch (error) {
                console.error(error); 
                // Chatbot had an error
                appendMessage("Error while fetching response", "bot"); 
            }
        }

        // What mssg to append and who sent it
        function appendMessage(message, sender) {
            // Display chatbox
            const chatbox = document.getElementById("chatbox");

            // Create element
            const msgElement = document.createElement("p"); // Paragraph that will contain the mssg 

            // If mssg sent by user, move it to right;  chatbot to the left 
            msgElement.classList = sender === "user" ? "text-right" : "text-left";

            msgElement.innerText = message; // The message is added as text

            chatbox.appendChild(msgElement); // Append to what is already there

            chatbox.scrollTop = chatbox.scrollHeight; // Makes it possible to scroll to the top

        }
    </script>
</body>
</html>
